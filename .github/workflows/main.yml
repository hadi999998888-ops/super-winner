name: Build LOOP HACK APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project (if a zip is in the repo)
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          if [ -n "$ZIP" ]; then
            echo "Unpacking $ZIP"
            mkdir -p _unz
            unzip -q -o "$ZIP" -d _unz
          else
            echo "No zip found, using repo files as they are"
          fi

      - name: Find project folder
        id: find
        run: |
          SETTINGS=$(find . -name 'settings.gradle.kts' -not -path './.git/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found. Upload LoopHack.zip to the repo root."
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LOOP-HACK-debug-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
